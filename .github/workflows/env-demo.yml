name: Env Demo

on:
  workflow_dispatch:

env:
  GREETING: Hello from the workflow
  LEVEL: workflow

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      LEVEL: job # override the workflow
    steps:
      - name: Read variables
        run: |
          echo "$GREETING"
          echo "Level is $LEVEL"

      - name: Step-level override
        env:
          LEVEL: step
        run: |
          echo "Level is $LEVEL"

      - name: Built-in variables
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "Runner OS: $RUNNER_OS"

      - name: Repository variable
        run: |
          echo "App name is: ${{ vars.APP_NAME }}"

      - name: Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "The secret is: $MY_SECRET"
          echo "The secret has ${#MY_SECRET} characters"
